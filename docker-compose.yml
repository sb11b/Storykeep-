services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: storykeep
      POSTGRES_PASSWORD: storykeep
      POSTGRES_DB: storykeep
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storykeep"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://storykeep:storykeep@db:5432/storykeep
      SEED_DEMO: "1"
      PORT: "8080"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  pgdata:
