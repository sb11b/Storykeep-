[package]
name = "storykeep-desktop"
version = "0.1.0"
description = "StoryKeep desktop wrapper (Tauri v2)"
authors = ["StoryKeep"]
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "storykeep_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Desktop overlay bubble (slice 1): the Ctrl+Alt+Space global hotkey that
# shows/hides the "overlay" window. `"2"` resolves to tauri-plugin-global-shortcut
# 2.4.1, which re-exports Shortcut/Modifiers/Code from global-hotkey 0.8 and
# exposes GlobalShortcutExt::global_shortcut().register(..) plus
# Builder::new().with_handler(..). Desktop-only: the plugin is not built for the
# Android/iOS targets this repo also ships, hence the target cfg (same form the
# plugin's own docs recommend for `cargo add`).
[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-global-shortcut = "2"

# Desktop auto-update: click-to-install updates served from the GitHub
# Releases latest.json endpoint (configured with the pubkey under
# plugins.updater in tauri.conf.json). `"2"` resolves to
# tauri-plugin-updater 2.13.3, the latest 2.x line and the one matching the
# tauri 2.x dependency above (verified on crates.io). Desktop-only for the
# same reason as the shortcut plugin. The plugin is registered in src/lib.rs
# inside the existing #[cfg(desktop)] setup block; the JS entry point is
# @tauri-apps/plugin-updater (npm ^2.13.3) behind the "updater:default"
# capability. Nothing downloads or installs without an explicit user click
# (see src/lib/auto-update.ts).
tauri-plugin-updater = "2"

[profile.release]
panic = "abort"   # Strip expensive panic clean-up logic
codegen-units = 1 # Compile crates one after another so the compiler can optimize better
lto = true        # Enables link to optimizations
opt-level = "s"   # Optimize for binary size
strip = true      # Remove debug symbols
