# Alembic configuration for Storykeep-.
# The actual DATABASE_URL is resolved at runtime from app.config.settings,
# so the sqlalchemy.url below is only a placeholder used when --name is
# not passed on the command line. env.py overrides it with settings.database_url.

[alembic]
# Directory where migration scripts live.
script_location = alembic

# Template used to generate migration file templates.
# file_template = %%(rev)s_%%(slug)s

# Timezone for filename timestamps (defaults to UTC).
timezone = UTC

# Maximum length of characters for a slugified message (<= rev id).
# slug_len = 40

# Path to the logging config file (relative to this file).
# log_config_file = alembic-log.ini

# Python format string for log line prefixes.
# log_timestamp_format = %%Y-%%m-%%d_%%H:%%M:%%S

# Output encoding for revision files.
# output_encoding = utf-8

# Placeholder; env.py resolves the real URL from app.config.settings.
sqlalchemy.url = postgresql+psycopg2://storykeep:storykeep@127.0.0.1:5432/storykeep

[post_write_hooks]
# Empty by default; add hooks here if needed.

# Logging configuration — mirrors the FastAPI app's INFO level.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname = root

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
